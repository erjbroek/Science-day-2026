<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoodleNet Local</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div id="predictionImageContainer">
        <img id="predictionImage" alt="" hidden>
    </div>

    <main class="container">

        <h1>DoodleNet</h1>

        <p class="description">
            Draw something and DoodleNet will try to recognize it.
        </p>

        <section class="drawing-section">

            <div class="buttons">
                <button id="drawButton" class="active">
                    Draw
                </button>

                <button id="eraseButton">
                    Erase
                </button>

                <button id="clearButton">
                    Clear
                </button>
            </div>

            <canvas id="canvas" width="280" height="280"></canvas>

        </section>


        <section class="status-section">
            <p id="status">Loading model...</p>
        </section>

        <section class="results-section">
            <section class="results-section">
                <div id="predictions"></div>
            </section>
        </section>
    </main>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <!-- Our application -->
    <script src="app.js"></script>
</body>

</html>
