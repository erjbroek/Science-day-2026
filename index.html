<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoodleNet Local</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <img id="robot" src="robot.png" alt="Robot">
    
    <div class="layout">

        <!-- Left: drawing + predictions -->
        <section class="drawing-section">
            <div class="buttons">
                <button id="drawButton" class="active">Tekenen</button>
                <button id="eraseButton">Gum</button>
                <button id="clearButton">Leeg maken</button>
            </div>

            <canvas id="canvas" width="280" height="280"></canvas>

            <p id="status">Loading model...</p>

            <div id="predictions"></div>
        </section>

        <!-- Right: picture of the guess -->
        <section class="image-section">
            <div id="predictionImageContainer">
                <img id="predictionImage" alt="" hidden>
            </div>
        </section>

    </div>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <!-- Our application -->
    <script src="app.js"></script>
</body>

</html>
